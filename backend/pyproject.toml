[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenderiq-api"
version = "0.1.0"
description = "TenderIQ tender matching API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "pymongo>=4.11,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
